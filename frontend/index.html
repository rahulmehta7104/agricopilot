<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-family:monospace;width:100%;">' + 
          '<h3>Global Error</h3>' +
          '<p>' + e.message + '</p>' +
          '<p>' + (e.filename || '') + ':' + (e.lineno || '') + '</p>' +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-family:monospace;width:100%;">' + 
          '<h3>Promise Rejection</h3>' +
          '<p>' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p>' +
          '</div>';
      });
    </script>
  </body>
</html>
